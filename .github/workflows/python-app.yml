
name: Mini-SIEM Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest -v

      - name: Generate sample logs
        run: python generate_sample_logs.py

      - name: Run Mini-SIEM
        run: python siem.py --auth sample_logs/auth.log --web sample_logs/access.log

